# HIPAA-Compliant Deployment Configuration

version: '3.8'

services:
  ocr-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_UPLOAD_SIZE=100
      # Load HIPAA configuration
      - $(cat config/hipaa.env | xargs)
    volumes:
      # Encrypted storage volumes
      - encrypted-uploads:/app/uploads:rw
      - encrypted-processed:/app/processed:rw
      - encrypted-output:/app/output:rw
      # Temporary storage (in-memory)
      - type: tmpfs
        target: /app/tmp
        tmpfs:
          size: 256M
          mode: 0770
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == worker
          - node.labels.hipaa == true

  nginx:
    image: nginx:stable
    volumes:
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "443:443"
    depends_on:
      - ocr-app
    networks:
      - internal
      - external
    deploy:
      placement:
        constraints:
          - node.role == worker
          - node.labels.hipaa == true

  audit-log:
    image: fluent/fluentd:v1.16
    volumes:
      - ./config/fluentd:/fluentd/etc
      - audit-logs:/logs
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role == worker
          - node.labels.hipaa == true

volumes:
  encrypted-uploads:
    driver: local
    driver_opts:
      type: ext4
      device: /dev/encrypted-uploads
      o: enc
  encrypted-processed:
    driver: local
    driver_opts:
      type: ext4
      device: /dev/encrypted-processed
      o: enc
  encrypted-output:
    driver: local
    driver_opts:
      type: ext4
      device: /dev/encrypted-output
      o: enc
  audit-logs:
    driver: local
    driver_opts:
      type: ext4
      device: /dev/audit-logs
      o: enc

networks:
  internal:
    driver: overlay
    internal: true
  external:
    driver: overlay
