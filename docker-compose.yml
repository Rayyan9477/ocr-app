version: '3.8'

services:
  ocr-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./processed:/app/processed
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./tmp:/app/tmp
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_UPLOAD_SIZE=100
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
